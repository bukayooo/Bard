name: Bard
options:
  bundleIdPrefix: com.bard
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
targets:
  Bard:
    type: application
    platform: macOS
    sources:
      - path: Bard/Sources
      - path: Bard/Resources
    info:
      path: Bard/Generated-Info.plist
      properties:
        CFBundleDisplayName: Bard
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: ""
        LSMinimumSystemVersion: "14.0"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bard.Bard
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Pinned to the free Personal Team's Apple Development identity so the app's
        # code signature is stable (cert + bundle id) across rebuilds. Without this,
        # Xcode falls back to ad-hoc signing, which hashes the actual binary bytes —
        # a new "identity" every rebuild — so Keychain treats each build as an
        # unrecognized app and reprompts for the login password every launch.
        DEVELOPMENT_TEAM: 9YYZ7P7Y9Q
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
schemes:
  Bard:
    build:
      targets:
        Bard: all
    run:
      config: Debug
    archive:
      config: Release
